# PortoFit — ambiente local de desenvolvimento.
# Credenciais lidas do ficheiro .env (não versionado); ver .env.example e docs/infraestrutura.md.

name: portofit

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?defina POSTGRES_ADMIN_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD no .env}
      POSTGRES_DB: postgres
      # Usados apenas pelo script de inicialização para criar catalog_db e o seu utilizador.
      CATALOG_DB_USER: ${CATALOG_DB_USER:?defina CATALOG_DB_USER no .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?defina CATALOG_DB_PASSWORD no .env}
      USERS_DB_USER: ${USERS_DB_USER:?defina USERS_DB_USER no .env}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?defina USERS_DB_PASSWORD no .env}
      EXPERIENCES_DB_USER: ${EXPERIENCES_DB_USER:?defina EXPERIENCES_DB_USER no .env}
      EXPERIENCES_DB_PASSWORD: ${EXPERIENCES_DB_PASSWORD:?defina EXPERIENCES_DB_PASSWORD no .env}
      COLLECTIONS_DB_USER: ${COLLECTIONS_DB_USER:?defina COLLECTIONS_DB_USER no .env}
      COLLECTIONS_DB_PASSWORD: ${COLLECTIONS_DB_PASSWORD:?defina COLLECTIONS_DB_PASSWORD no .env}
      MESSAGING_DB_USER: ${MESSAGING_DB_USER:?defina MESSAGING_DB_USER no .env}
      MESSAGING_DB_PASSWORD: ${MESSAGING_DB_PASSWORD:?defina MESSAGING_DB_PASSWORD no .env}
    volumes:
      # PostgreSQL 18+: o volume monta em /var/lib/postgresql (os dados ficam em 18/docker).
      - postgres-data:/var/lib/postgresql
      - ./backend/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    # Sem "ports": a base de dados só é acessível dentro da rede interna do Compose.
    healthcheck:
      # Por TCP: durante a inicialização o servidor temporário só aceita ligações locais por socket,
      # por isso o estado "healthy" só aparece depois de os scripts de inicialização terminarem.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  catalog-service:
    build: ./backend/catalog-service
    image: portofit/catalog-service:0.1.0
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: catalog_db
      DB_USER: ${CATALOG_DB_USER:?defina CATALOG_DB_USER no .env}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?defina CATALOG_DB_PASSWORD no .env}
      # Ambiente local: carrega os locais FICTÍCIOS de demonstração (ver docs/infraestrutura.md).
      # Retirar "demo" para arrancar só com o esquema e as modalidades de referência.
      SPRING_PROFILES_ACTIVE: demo
      # Avaliações agregadas (timeout ~1 s; se falhar, as avaliações vêm UNAVAILABLE e o resto responde).
      EXPERIENCES_BASE_URL: http://experiences-service:8083
    ports:
      # Só no loopback do computador; o emulador Android chega aqui por 10.0.2.2:8081.
      - "127.0.0.1:8081:8081"
    networks:
      - data
      - public
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      # A imagem JRE não tem curl/wget; usa-se o /dev/tcp do bash para pedir o estado de saúde.
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8081 && printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "\"status\":\"UP\"" <&3']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  users-service:
    build: ./backend/users-service
    image: portofit/users-service:0.1.0
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: users_db
      DB_USER: ${USERS_DB_USER:?defina USERS_DB_USER no .env}
      DB_PASSWORD: ${USERS_DB_PASSWORD:?defina USERS_DB_PASSWORD no .env}
      # Chaves de assinatura dos JWT, geradas uma vez com scripts/generate-jwt-keys.sh.
      JWT_PRIVATE_KEY_PATH: /run/secrets/users-jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/users-jwt/public.pem
      # Validação de interesses (GET /api/v1/sports), pela rede interna do Compose.
      CATALOG_BASE_URL: http://catalog-service:8081
      # Chave interna do experiences-service para o feed-context (docs/users-api.md §3.11), só do .env.
      USERS_INTERNAL_KEY: ${USERS_INTERNAL_KEY:?defina USERS_INTERNAL_KEY no .env}
    volumes:
      # Só de leitura e fora da imagem; a pasta secrets/ não está no Git.
      - ./secrets/users-jwt:/run/secrets/users-jwt:ro
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - data
      - public
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8082 && printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "\"status\":\"UP\"" <&3']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  experiences-service:
    build: ./backend/experiences-service
    image: portofit/experiences-service:0.1.0
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: experiences_db
      DB_USER: ${EXPERIENCES_DB_USER:?defina EXPERIENCES_DB_USER no .env}
      DB_PASSWORD: ${EXPERIENCES_DB_PASSWORD:?defina EXPERIENCES_DB_PASSWORD no .env}
      # Só a chave PÚBLICA, para validar localmente os access tokens do users-service.
      JWT_PUBLIC_KEY_PATH: /run/secrets/users-jwt/public.pem
      # Validação de atividades (GET /api/v1/offerings/{id}?includeRating=false), pela rede interna.
      CATALOG_BASE_URL: http://catalog-service:8081
      # Fotografias (docs/experiences-api.md §12.3), no volume próprio abaixo.
      MEDIA_DIR: /data/media
      # Contexto do feed pessoal (docs/experiences-api.md §14.3), pela rede interna; a chave só vem do .env.
      USERS_BASE_URL: http://users-service:8082
      USERS_INTERNAL_KEY: ${USERS_INTERNAL_KEY:?defina USERS_INTERNAL_KEY no .env}
      # Chave do collections-service para a consulta interna em lote (docs/experiences-api.md §4.7), só do .env.
      COLLECTIONS_INTERNAL_KEY: ${COLLECTIONS_INTERNAL_KEY:?defina COLLECTIONS_INTERNAL_KEY no .env}
      # Chave própria do messaging-service para a mesma consulta (docs/messaging-api.md §7.4), só do .env.
      MESSAGING_INTERNAL_KEY: ${MESSAGING_INTERNAL_KEY:?defina MESSAGING_INTERNAL_KEY no .env}
    volumes:
      # Só o ficheiro da chave pública, só de leitura; a chave privada não é montada neste contentor.
      - ./secrets/users-jwt/public.pem:/run/secrets/users-jwt/public.pem:ro
      # Volume persistente das fotografias, fora da imagem; copiar junto com o do PostgreSQL.
      - experiences-media:/data/media
    ports:
      - "127.0.0.1:8083:8083"
    networks:
      - data
      - public
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8083 && printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "\"status\":\"UP\"" <&3']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  collections-service:
    build: ./backend/collections-service
    image: portofit/collections-service:0.1.0
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: collections_db
      DB_USER: ${COLLECTIONS_DB_USER:?defina COLLECTIONS_DB_USER no .env}
      DB_PASSWORD: ${COLLECTIONS_DB_PASSWORD:?defina COLLECTIONS_DB_PASSWORD no .env}
      # Só a chave PÚBLICA, para validar localmente os access tokens do users-service.
      JWT_PUBLIC_KEY_PATH: /run/secrets/users-jwt/public.pem
      # Consulta interna em lote (docs/collections-api.md §7), pela rede interna; a chave só vem do .env.
      EXPERIENCES_BASE_URL: http://experiences-service:8083
      COLLECTIONS_INTERNAL_KEY: ${COLLECTIONS_INTERNAL_KEY:?defina COLLECTIONS_INTERNAL_KEY no .env}
    volumes:
      # Só o ficheiro da chave pública, só de leitura; a chave privada não é montada neste contentor.
      - ./secrets/users-jwt/public.pem:/run/secrets/users-jwt/public.pem:ro
    ports:
      - "127.0.0.1:8084:8084"
    networks:
      - data
      - public
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8084 && printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "\"status\":\"UP\"" <&3']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  messaging-service:
    build: ./backend/messaging-service
    image: portofit/messaging-service:0.1.0
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: messaging_db
      DB_USER: ${MESSAGING_DB_USER:?defina MESSAGING_DB_USER no .env}
      DB_PASSWORD: ${MESSAGING_DB_PASSWORD:?defina MESSAGING_DB_PASSWORD no .env}
      # Só a chave PÚBLICA, para validar localmente os access tokens do users-service.
      JWT_PUBLIC_KEY_PATH: /run/secrets/users-jwt/public.pem
      # Perfil público para validar o destinatário de uma conversa nova (docs/messaging-api.md §8.1), sem token.
      USERS_BASE_URL: http://users-service:8082
      # Consulta interna em lote (docs/messaging-api.md §7.4), com a chave exclusiva deste serviço, só do .env.
      EXPERIENCES_BASE_URL: http://experiences-service:8083
      MESSAGING_INTERNAL_KEY: ${MESSAGING_INTERNAL_KEY:?defina MESSAGING_INTERNAL_KEY no .env}
    volumes:
      # Só o ficheiro da chave pública, só de leitura; a chave privada não é montada neste contentor.
      - ./secrets/users-jwt/public.pem:/run/secrets/users-jwt/public.pem:ro
    ports:
      - "127.0.0.1:8085:8085"
    networks:
      - data
      - public
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8085 && printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "\"status\":\"UP\"" <&3']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  # Rede interna: sem acesso ao exterior nem portas publicadas.
  data:
    internal: true
  # Rede usada para publicar as portas dos serviços no computador (só em 127.0.0.1).
  public: {}

volumes:
  postgres-data:
  experiences-media:
