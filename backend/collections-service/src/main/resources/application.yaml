spring:
  application:
    name: collections-service
  datasource:
    # Valores fornecidos por variáveis de ambiente (docker-compose.yml + .env).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:collections_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
      data-source-properties:
        connectTimeout: 5
        socketTimeout: 30
  flyway:
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8084
  shutdown: graceful
  tomcat:
    connection-timeout: 10s
    threads:
      max: 50

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

portofit:
  security:
    # Validação local dos access tokens do users-service; só a chave PÚBLICA, montada só de leitura.
    issuer: portofit-users
    audience: portofit-api
    public-key-location: ${JWT_PUBLIC_KEY_PATH:/run/secrets/users-jwt/public.pem}
  experiences:
    # GET /api/v1/internal/experiences?ids=…, pela rede interna do Compose (docs/collections-api.md §7).
    base-url: ${EXPERIENCES_BASE_URL:http://localhost:8083}
    connect-timeout: 500ms
    timeout: 2s
    # Só do .env (COLLECTIONS_INTERNAL_KEY), nunca no Git nem na imagem.
    internal-key: ${COLLECTIONS_INTERNAL_KEY:}
  collections:
    # Limites (docs/collections-api.md §9).
    max-per-owner: 50
    max-items: 500
    # Garantia contra listas duplicadas só dentro deste prazo (docs/collections-api.md §5.2).
    idempotency-retention: 7d
    max-body-bytes: 4096
