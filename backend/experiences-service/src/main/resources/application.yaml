spring:
  application:
    name: experiences-service
  datasource:
    # Valores fornecidos por variáveis de ambiente (docker-compose.yml + .env).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:experiences_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
      data-source-properties:
        connectTimeout: 5
        socketTimeout: 30
  flyway:
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      # Fotografias (docs/experiences-api.md §12.2): ficheiro até 10 MiB, pedido até 10 MiB + 64 KiB.
      max-file-size: 10MB
      max-request-size: 10304KB

server:
  port: 8083
  shutdown: graceful
  tomcat:
    connection-timeout: 10s
    threads:
      max: 50
    # Lê o resto de um upload recusado para conseguir responder 413 (em vez de fechar a ligação).
    max-swallow-size: 11MB

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

portofit:
  security:
    # Validação local dos access tokens do users-service; só a chave PÚBLICA, montada só de leitura.
    issuer: portofit-users
    audience: portofit-api
    public-key-location: ${JWT_PUBLIC_KEY_PATH:/run/secrets/users-jwt/public.pem}
  catalog:
    # GET /api/v1/offerings/{id}?includeRating=false, pela rede interna do Compose.
    base-url: ${CATALOG_BASE_URL:http://localhost:8081}
    connect-timeout: 500ms
    timeout: 2s
    # Atraso máximo aceite nos dados do catálogo usados para validar (docs/experiences-api.md §6.2).
    cache-ttl: 10m
  users:
    # GET /api/v1/internal/me/feed-context, pela rede interna do Compose (docs/experiences-api.md §14.3).
    base-url: ${USERS_BASE_URL:http://localhost:8082}
    connect-timeout: 500ms
    timeout: 1s
    # Só do .env (USERS_INTERNAL_KEY), nunca no Git nem na imagem.
    internal-key: ${USERS_INTERNAL_KEY:}
  internal:
    # Uma chave por serviço cliente da consulta em lote (docs/experiences-api.md §4.7), só do .env; vazia = recusa.
    collections-key: ${COLLECTIONS_INTERNAL_KEY:}
    messaging-key: ${MESSAGING_INTERNAL_KEY:}
  feed:
    # Bloco recente do feed popular (docs/experiences-api.md §14.1).
    recent-days: 30
    # Modo de demonstração (§14.6): com o catálogo real, as publicações de locais fictícios ficam fora dos feeds
    # (continuam acessíveis pelo id e no perfil do autor). Num ambiente de demonstração: FEED_INCLUDE_DEMO_PLACES=true.
    include-demo-places: ${FEED_INCLUDE_DEMO_PLACES:false}
  publishing:
    # Limite por autor, em memória (docs/experiences-api.md §4.1).
    max-per-author: 30
    window: 1h
    # Garantia contra duplicação só dentro deste prazo (docs/experiences-api.md §5).
    idempotency-retention: 7d
    max-body-bytes: 16384
  interactions:
    # Limites por pessoa, em memória (docs/experiences-api.md §13.6).
    max-comments-per-author: 60
    comment-window: 1h
    max-like-changes-per-user: 300
    like-window: 1h
    # Uma visualização contada por pessoa ou chave em cada período fixo (docs/experiences-api.md §13.5).
    view-period: 24h
  media:
    # Volume próprio e persistente (docker-compose.yml); fora da imagem Docker.
    storage-dir: ${MEDIA_DIR:./build/media-dev}
    max-file-bytes: 10485760
    min-side: 200
    max-side: 8000
    max-pixels: 40000000
    output-max-side: 1600
    decode-max-side: 3200
    jpeg-quality: 0.85
    max-concurrent-processing: 2
    processing-wait: 10s
    max-pending-per-owner: 20
    pending-ttl: 24h
    orphan-age: 1h
  notifications:
    # POST /api/v1/internal/events, pela rede interna do Compose (docs/notifications-api.md §6.1).
    base-url: ${NOTIFICATIONS_BASE_URL:http://localhost:8086}
    connect-timeout: 500ms
    timeout: 5s
    # Só do .env (NOTIFY_EXPERIENCES_KEY, exclusiva deste produtor), nunca no Git nem na imagem.
    internal-key: ${NOTIFY_EXPERIENCES_KEY:}
  outbox:
    # Envio de 5 em 5 s, recuo de 5 s a 10 min, FAILED ao fim de 20 tentativas ou 24 h (docs/notifications-api.md §7).
    enabled: true
    batch-size: 100
    initial-backoff: 5s
    max-backoff: 10m
    max-attempts: 20
    max-age: 24h
    sent-retention: 3d
    failed-retention: 30d
